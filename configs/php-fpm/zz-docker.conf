[www]

user = www-data
group = www-data

listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Dynamic process manager.
pm = dynamic

; Maximum number of child processes.
pm.max_children = 50

; Number of child processes created on startup.
pm.start_servers = 10

; Minimum number of spare idle processes.
pm.min_spare_servers = 5

; Maximum number of spare idle processes.
pm.max_spare_servers = 15

; Maximum number of requests each child process should execute.
pm.max_requests = 500

; Request timeout.
request_terminate_timeout = 300

; Catch worker output.
catch_workers_output = yes

; Clear environment (needed for Docker env vars)
clear_env = no

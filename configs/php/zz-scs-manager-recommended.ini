; PHP settings shared by the production and the development image.

; SCS Manager: long-running provisioning requests and large uploads.
max_execution_time = 1200
max_input_time = 600
memory_limit = 1024M
max_file_uploads = 50
post_max_size = 1024M
upload_max_filesize = 1024M

; Drupal.
output_buffering = on

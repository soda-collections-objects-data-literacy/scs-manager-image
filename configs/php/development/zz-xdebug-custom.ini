; Xdebug for an IDE attached into the container (Cursor / VS Code / Claude
; Code as `developer`). Trigger mode: start a session with XDEBUG_TRIGGER /
; XDEBUG_SESSION (browser helper, cookie, or env for Drush).
; For an IDE on the host, set XDEBUG_CONFIG="client_host=host.docker.internal"
; in Compose or bind-mount your own file over this one (same file name).
xdebug.mode=debug,develop
xdebug.start_with_request=trigger
xdebug.client_host=127.0.0.1
xdebug.client_port=9003
xdebug.discover_client_host=false
xdebug.idekey=scs
xdebug.log=/var/log/xdebug/xdebug.log
xdebug.log_level=3
; Drupal entities are deep; keep variable serialization small.
xdebug.max_children=32
xdebug.max_data=256
xdebug.max_depth=2

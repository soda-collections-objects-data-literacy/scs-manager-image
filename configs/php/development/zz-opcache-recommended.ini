; Development: keep OPcache on but re-stat files on every request, so edits
; in the module and theme clones take effect without a PHP-FPM restart.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=10
; JIT and Xdebug fight; leave JIT off while the debugger extension is loaded.
opcache.jit=disable
opcache.jit_buffer_size=0

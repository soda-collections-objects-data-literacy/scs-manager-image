; Sessions live in Redis database 2 (the cache bins use the Redis module).
; A request that cannot get the session lock retries 100 times, 5000
; microseconds apart (about half a second), so a stuck lock cannot freeze AJAX.
redis.session.locking_enabled=1
redis.session.lock_retries=100
redis.session.lock_wait_time=5000
session.save_handler = redis
session.save_path = "tcp://redis:6379?database=2"

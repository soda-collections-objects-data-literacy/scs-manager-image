name: Publish SCS Manager Docker Images

on:
  # main is the rolling development line (image tag :main); X.x branches are
  # only cut from a release tag to maintain an older major (image tag :X.x).
  push:
    branches: [main, "*.x"]
    tags:
      - "*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64
  CONTEXT_DIRECTORY: .
  # Composer constraint for the stable image. ^4.1 takes the newest 4.x
  # release from 4.1.0 on, without pinning a patch.
  SODA_SCS_MANAGER_VERSION: "^4.1"
  # Development image checks out this branch (composer: 4.x-dev).
  SODA_SCS_MANAGER_DEV_VERSION: "4.x-dev"
  # Default frontend theme (public repo soda-collections-objects-data-literacy/scs_custom_theme).
  SCS_CUSTOM_THEME_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - mode: production
            image_name: soda-collections-objects-data-literacy/scs-manager-image-production
          - mode: development
            image_name: soda-collections-objects-data-literacy/scs-manager-image-development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `latest` follows the newest release tag, not a branch.
      - name: Determine if latest release tag
        id: release
        run: |
          is_latest=false
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            current="${GITHUB_REF#refs/tags/}"
            latest=$(git tag -l '*.*.*' --sort=-v:refname | head -1)
            if [[ -n "$latest" && "$current" == "$latest" ]]; then
              is_latest=true
            fi
          fi
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ env.REGISTRY }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable=${{ steps.release.outputs.is_latest == 'true' }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_DIRECTORY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODE=${{ matrix.mode }}
            SODA_SCS_MANAGER_VERSION=${{ env.SODA_SCS_MANAGER_VERSION }}
            SODA_SCS_MANAGER_DEV_VERSION=${{ env.SODA_SCS_MANAGER_DEV_VERSION }}
            SCS_CUSTOM_THEME_REF=${{ env.SCS_CUSTOM_THEME_REF }}
          platforms: ${{ env.PLATFORMS }}
          pull: true
          push: true
          provenance: false
